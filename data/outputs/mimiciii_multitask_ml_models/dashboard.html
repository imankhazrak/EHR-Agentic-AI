<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIMIC-III Multi-task ML Metrics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #e2e5ee;
      --text: #1f2330;
      --muted: #6b7280;
      --accent: #3b5bdb;
      --accent-soft: #eef1ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 20px 28px 14px;
      background: linear-gradient(135deg, #3b5bdb 0%, #5c7cfa 100%);
      color: #fff;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
    }
    header p {
      margin: 0;
      opacity: 0.85;
      font-size: 13px;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    fieldset.panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px 12px;
      margin: 0;
    }
    fieldset.panel legend {
      padding: 0 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .panel-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .panel-actions button {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #d4dcff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .panel-actions button:hover { background: #dde4ff; }
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .checkbox-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .checkbox-list label:hover { background: #f1f3f9; }
    .checkbox-list input[type="checkbox"] { accent-color: var(--accent); }
    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      position: relative;
    }
    #chartWrap {
      position: relative;
      height: 560px;
    }
    #emptyState {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
    #emptyState.visible { display: flex; }
    footer {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px 20px 24px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 900px) {
      .filters { grid-template-columns: 1fr; }
      #chartWrap { height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MIMIC-III Multi-task ML Metrics Dashboard</h1>
    <p>Compare ML models, metrics, and dataset splits across the 7 target labels.</p>
  </header>

  <main>
    <div class="filters">
      <fieldset class="panel">
        <legend>Models</legend>
        <div class="panel-actions">
          <button type="button" data-action="all" data-group="model">Select all</button>
          <button type="button" data-action="none" data-group="model">Clear</button>
        </div>
        <div class="checkbox-list" id="filter-model"></div>
      </fieldset>

      <fieldset class="panel">
        <legend>Metrics</legend>
        <div class="panel-actions">
          <button type="button" data-action="all" data-group="metric">Select all</button>
          <button type="button" data-action="none" data-group="metric">Clear</button>
        </div>
        <div class="checkbox-list" id="filter-metric"></div>
      </fieldset>

      <fieldset class="panel">
        <legend>Datasets</legend>
        <div class="panel-actions">
          <button type="button" data-action="all" data-group="split">Select all</button>
          <button type="button" data-action="none" data-group="split">Clear</button>
        </div>
        <div class="checkbox-list" id="filter-split"></div>
      </fieldset>
    </div>

    <div class="chart-card">
      <div id="chartWrap">
        <canvas id="chart"></canvas>
        <div id="emptyState">Select at least one option in each panel to display the chart.</div>
      </div>
    </div>
  </main>

  <footer>
    <span id="rowCount"></span>
    <span>X-axis: target labels &middot; Y-axis: metric value (0&ndash;100)</span>
  </footer>

    ];

    const TARGET_LABELS = [
      "label_lipid_disorder",
      "label_diabetes_current",
      "label_hypertension_current",
      "label_obesity_current",
      "label_cardio_next",
      "label_kidney_next",
      "label_stroke_next"
    ];

    const METRICS = ["accuracy", "sensitivity", "specificity", "f1", "auc", "auprc"];
    const MODELS = ["logistic_regression", "decision_tree", "random_forest"];
    const SPLITS = ["train_inner", "val_inner", "test"];

    const DEFAULTS = {
      model: new Set(MODELS),
      metric: new Set(["auc"]),
      split: new Set(["test"])
    };

    function prettify(s) {
      return s
        .replace(/^label_/, "")
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function buildFilters() {
      const groups = [
        { id: "filter-model",  values: MODELS,  group: "model"  },
        { id: "filter-metric", values: METRICS, group: "metric" },
        { id: "filter-split",  values: SPLITS,  group: "split"  }
      ];
      for (const g of groups) {
        const container = document.getElementById(g.id);
        container.innerHTML = "";
        for (const v of g.values) {
          const id = `${g.group}-${v}`;
          const wrap = document.createElement("label");
          wrap.htmlFor = id;
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = id;
          cb.value = v;
          cb.dataset.group = g.group;
          cb.checked = DEFAULTS[g.group].has(v);
          cb.addEventListener("change", render);
          const span = document.createElement("span");
          span.textContent = g.group === "model"
            ? v.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase())
            : v;
          wrap.appendChild(cb);
          wrap.appendChild(span);
          container.appendChild(wrap);
        }
      }

      document.querySelectorAll(".panel-actions button").forEach(btn => {
        btn.addEventListener("click", () => {
          const group = btn.dataset.group;
          const setTo = btn.dataset.action === "all";
          document
            .querySelectorAll(`input[type="checkbox"][data-group="${group}"]`)
            .forEach(cb => { cb.checked = setTo; });
          render();
        });
      });
    }

    function getSelected(group) {
      return Array.from(
        document.querySelectorAll(`input[type="checkbox"][data-group="${group}"]:checked`)
      ).map(cb => cb.value);
    }

    function colorFor(key) {
      let h = 0;
      for (let i = 0; i < key.length; i++) {
        h = (h * 31 + key.charCodeAt(i)) >>> 0;
      }
      const hue = h % 360;
      const sat = 60 + (h % 20);
      const lit = 45 + ((h >> 3) % 10);
      return `hsl(${hue}, ${sat}%, ${lit}%)`;
    }

    function buildDatasets(models, metrics, splits) {
      const out = [];
      const xLabels = TARGET_LABELS;
      for (const m of models) {
        for (const met of metrics) {
          for (const s of splits) {
            const data = xLabels.map(lbl => {
              const row = RAW.find(r => r.model === m && r.split === s && r.label === lbl);
              return row ? row[met] : null;
            });
            const key = `${m} / ${met} / ${s}`;
            const color = colorFor(key);
            out.push({
              label: key,
              data,
              borderColor: color,
              backgroundColor: color,
              pointBackgroundColor: color,
              pointBorderColor: "#ffffff",
              pointBorderWidth: 1.5,
              pointRadius: 4,
              pointHoverRadius: 6,
              borderWidth: 2,
              tension: 0.25,
              spanGaps: true
            });
          }
        }
      }
      return out;
    }

    let chart = null;

    function render() {
      const models  = getSelected("model");
      const metrics = getSelected("metric");
      const splits  = getSelected("split");

      const datasets = buildDatasets(models, metrics, splits);
      const empty = document.getElementById("emptyState");
      const canvas = document.getElementById("chart");

      document.getElementById("rowCount").textContent =
        `Showing ${datasets.length} line${datasets.length === 1 ? "" : "s"} \u00b7 ${RAW.length} data rows`;

      if (datasets.length === 0) {
        empty.classList.add("visible");
        canvas.style.visibility = "hidden";
        if (chart) { chart.destroy(); chart = null; }
        return;
      }
      empty.classList.remove("visible");
      canvas.style.visibility = "visible";

      const xDisplay = TARGET_LABELS.map(prettify);

      const config = {
        type: "line",
        data: { labels: xDisplay, datasets },
        plugins: [ChartDataLabels],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "nearest", intersect: false },
          layout: { padding: { top: 24, right: 12, bottom: 4, left: 4 } },
          scales: {
            y: {
              min: 0,
              max: 105,
              ticks: { stepSize: 10, callback: v => v <= 100 ? v : "" },
              title: { display: true, text: "Value (0\u2013100)" },
              grid: { color: "#eef0f5" }
            },
            x: {
              title: { display: true, text: "Target label" },
              grid: { display: false },
              ticks: { autoSkip: false, maxRotation: 30, minRotation: 0 }
            }
          },
          plugins: {
            legend: {
              position: "bottom",
              labels: { boxWidth: 14, boxHeight: 8, font: { size: 11 } }
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)}`
              }
            },
            datalabels: {
              align: "top",
              anchor: "end",
              offset: 4,
              clamp: true,
              clip: false,
              color: ctx => ctx.dataset.borderColor,
              font: { size: 10, weight: "600" },
              formatter: v => (v == null ? "" : Number(v).toFixed(1))
            }
          }
        }
      };

      if (chart) chart.destroy();
      chart = new Chart(canvas.getContext("2d"), config);
    }

    document.addEventListener("DOMContentLoaded", () => {
      buildFilters();
      render();
    });
  </script>
</body>
</html>
